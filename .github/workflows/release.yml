name: release

# 打 v* tag 时构建两个平台的产物并挂到 Release。
# ★ 这是 Windows 端唯一的真实验证手段 —— 开发机只有 macOS,交叉编译只能证明"编译得过",
#   证明不了打包、安装、WebView2 与托盘行为。CI 的 Windows leg 是真机构建。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false          # 一边挂掉不要把另一边的产物一起弄丢
      matrix:
        include:
          # ★★ 绝不要写 macos-13:那个 Intel runner 已退役,列它会让 job 排队约 24 小时
          #    然后**取消整个 run**,把 Windows 那条腿一起带走(在另一个项目上实测过)。
          #    macos-latest 是 ARM,靠 universal target 同时出 Intel 产物。
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows 已取消（用户 2026-10-19「取消 windows 版本的设计与发布」）：只出 macOS。
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codexbar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: codexbar/src-tauri -> target

      # Linux 才需要 webkit2gtk 一类的系统依赖;mac/win 无需额外 apt。
      # Windows 的 WebView2 由 NSIS 安装包自带 bootstrapper 处理,构建机不用装。
      - run: npm ci
        working-directory: codexbar

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: codexbar
          tagName: ${{ github.ref_name }}
          releaseName: 'AICoop ${{ github.ref_name }}'
          releaseDraft: true          # 先出草稿,人工核过产物再公开
          # 带连字符的 tag（v1.12.0-beta.1）= 预发布：不标成 Latest；app 内「检查更新」只认三段数字 tag，也不会推给普通用户
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      # ★★ 对**刚构建出来的 `.app`** 跑一次脚本级冒烟（B85，四方评审 P2），不起 GUI。
      #   作者机是 clone 装机，`.dmg` 那条路（脚本被复制进 `<store>/runtime/`）在他机器上一次都不会走到；
      #   这里把包里的脚本摆成 `.dmg` 接入后的布局、不设任何 store 变量，断言所有入口求出同一个数据目录，
      #   并核对包里 `RUNTIME_FILES` 一个不缺（B77 的 `dawn_sched.py` 就是这么漏的）。
      #   ⚠️ release 是草稿（releaseDraft），这一步红 ⇒ 别点发布。
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with: { python-version: '3.12' }
      - name: 安装包脚本冒烟（.dmg 布局）
        if: runner.os == 'macOS'
        run: |
          APP="$(find codexbar/src-tauri/target -type d -path '*/bundle/macos/AICoop.app' | head -1)"
          test -n "$APP" || { echo "找不到构建出的 AICoop.app"; exit 1; }
          python3 -m pip install --quiet pytest
          CODEXBAR_BUNDLE_SCRIPTS="$APP/Contents/Resources/scripts" python3 -m pytest tests/test_store_root_dmg_layout.py -q -rs

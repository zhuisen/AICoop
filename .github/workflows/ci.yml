name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    # 不变量守卫是纯 stdlib Python(AST 静态分析 + 隔离夹具),不碰凭证、不联网。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # ★★ **必须与本机同一条命令。** 此前 CI 跑 `unittest discover`(856 条)、
      #    而本地跑 pytest(879 条) —— **23 条从来没被 CI 守过**，且 pytest 才收
      #    plain `Test*` 类。两条不同的命令 = 两个不同的门，而只有一个会红。
      #    （2026-09-10：`test_proxy_relay_upstream` 因 `import pytest` 在 CI 直接
      #    ImportError，而本地一直绿。）
      # ★ pyflakes 是 `test_no_undefined_names.py` 的探针。没装它那条闸会 **skip**，
      #   而 skip 在汇总行里和绿色一样不刺眼 —— 本仓的规矩是 skip 不算绿。
      - run: python3 -m pip install --quiet pytest pyflakes
      # ★ zstd 测试缺解压器时会 skip，而 skip 不是绿（B84/B85）。ubuntu 镜像通常自带，这里确保一定有。
      - run: command -v zstd || sudo apt-get install -y zstd
      - run: python3 -m pytest tests/ -q

  # ★★ 同一套守卫在 **macOS** 上再跑一遍（B85 · 四方评审 P2）。产品只在 macOS 上用，而上面那条在 ubuntu ——
  #   `/bin/bash` 3.2、BSD 工具、`/opt/homebrew` 布局这些差异只有这里碰得到（B74 的 bash 3.2 就是这一类）。
  #   ⚠️ 2026-10-16 加入时**未在 CI 上跑过**（本机 = macOS，全套绿）；第一次推送后看它的结果再下结论。
  invariants-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m pip install --quiet pytest pyflakes
      - run: command -v zstd || brew install zstd
      - run: python3 -m pytest tests/ -q

  build:
    strategy:
      fail-fast: false
      # ★ Windows 已取消（用户 2026-10-19「取消 windows 版本的设计与发布」）：只构建 macOS。
      #   `portalock` 的 LockFileEx 分支与 install-windows.ps1 从此不再有真机 / 语法验证 —— 代码留着没删，但不再被守。
      matrix:
        platform: [macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codexbar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: codexbar/src-tauri -> target
      - run: npm ci
        working-directory: codexbar
      # ★ 用 `npm run build` 不是 `tsc --noEmit`:构建走 tsc -b(project references)且开着
      #   noUnusedLocals,--noEmit 不开 —— 曾连过两轮 --noEmit 却在真构建时被 TS6133 打回。
      - run: npm run build
        working-directory: codexbar
      - run: cargo check --manifest-path codexbar/src-tauri/Cargo.toml
      # ★ Rust 单测（全方面评审 §11：原来 CI 一条都不跑）。只跑 lib：doctest 已在 Cargo.toml 关掉。
      - run: cargo test --lib --manifest-path codexbar/src-tauri/Cargo.toml

      # ⚠️ 这一步原来在 windows-latest 上跑，是 `portalock` LockFileEx 分支的唯一真实验证。
      #    Windows 取消（2026-10-19）后矩阵只剩 macOS，这里跑到的只是 fcntl 分支 —— LockFileEx 不再被验证。
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest tests.test_portalock -v


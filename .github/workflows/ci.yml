name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    # 不变量守卫是纯 stdlib Python(AST 静态分析 + 隔离夹具),不碰凭证、不联网。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # ★★ **必须与本机同一条命令。** 此前 CI 跑 `unittest discover`(856 条)、
      #    而本地跑 pytest(879 条) —— **23 条从来没被 CI 守过**，且 pytest 才收
      #    plain `Test*` 类。两条不同的命令 = 两个不同的门，而只有一个会红。
      #    （2026-09-10：`test_proxy_relay_upstream` 因 `import pytest` 在 CI 直接
      #    ImportError，而本地一直绿。）
      # ★ pyflakes 是 `test_no_undefined_names.py` 的探针。没装它那条闸会 **skip**，
      #   而 skip 在汇总行里和绿色一样不刺眼 —— 本仓的规矩是 skip 不算绿。
      - run: python3 -m pip install --quiet pytest pyflakes
      # ★ zstd 测试缺解压器时会 skip，而 skip 不是绿（B84/B85）。ubuntu 镜像通常自带，这里确保一定有。
      - run: command -v zstd || sudo apt-get install -y zstd
      - run: python3 -m pytest tests/ -q

  # ★★ 同一套守卫在 **macOS** 上再跑一遍（B85 · 四方评审 P2）。产品只在 macOS 上用，而上面那条在 ubuntu ——
  #   `/bin/bash` 3.2、BSD 工具、`/opt/homebrew` 布局这些差异只有这里碰得到（B74 的 bash 3.2 就是这一类）。
  # ★★ 这一条同时跑 **UI 闸**（2026-10-23，用户「CI 跑 UI 闸」）：harness 用仓库里的固定夹具
  #   `codexbar/uishot/fixture/`（脱敏快照 + 日期平移），不需要本机的 state.json / 用量快照。
  #   `CODEXBAR_REQUIRE_HARNESS=1` ⇒ 因为 harness / Chrome / playwright 不在而 skip 的 UI 闸一律算红（tests/conftest.py）。
  #   ⚠️ 加入时**未在 CI 上跑过**（只在本机验过）；第一次推送后看它的结果再下结论。
  invariants-macos:
    runs-on: macos-latest
    env:
      CODEXBAR_REQUIRE_HARNESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codexbar/package-lock.json
      # playwright 只要 Python 包：测试用 `executable_path` 指向 runner 自带的 Google Chrome，不下载浏览器
      - run: python3 -m pip install --quiet pytest pyflakes playwright
      - run: command -v zstd || brew install zstd
      - run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - run: npm ci
        working-directory: codexbar
      # 顺序不能反：vite build 会清空 outDir（make_harness.py 的陈旧产物闸）
      - run: npx vite build --outDir uishot/app && python3 uishot/make_harness.py
        working-directory: codexbar
      - name: harness static server (127.0.0.1:3304)
        run: |
          nohup python3 -m http.server 3304 --bind 127.0.0.1 --directory codexbar/uishot/app > "$RUNNER_TEMP/harness.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3304/harness.html > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/harness.log"; exit 1
      # ★ macOS runner 默认开着「减弱动态效果」（2026-10-23 探针实测 reduce=true，本机 false），
      #   动效 / 计时类 UI 断言因此全红 9 条。关掉，让 runner 与开发机同一环境；探针在下一步核它真关掉了。
      - name: turn off Reduce Motion (match the dev machine)
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false || true
          defaults write com.apple.Accessibility ReduceMotionEnabled -bool false || true
          killall cfprefsd || true
          python3 -m pytest tests/test_ci_browser_probe.py -q -rs
      - run: python3 -m pytest tests/ -q -rs

  build:
    strategy:
      fail-fast: false
      # ★ Windows 已取消（用户 2026-10-19「取消 windows 版本的设计与发布」）：只构建 macOS。
      #   `portalock` 的 LockFileEx 分支与 install-windows.ps1 从此不再有真机 / 语法验证 —— 代码留着没删，但不再被守。
      matrix:
        platform: [macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codexbar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: codexbar/src-tauri -> target
      - run: npm ci
        working-directory: codexbar
      # ★ 用 `npm run build` 不是 `tsc --noEmit`:构建走 tsc -b(project references)且开着
      #   noUnusedLocals,--noEmit 不开 —— 曾连过两轮 --noEmit 却在真构建时被 TS6133 打回。
      - run: npm run build
        working-directory: codexbar
      - run: cargo check --manifest-path codexbar/src-tauri/Cargo.toml
      # ★ Rust 单测（全方面评审 §11：原来 CI 一条都不跑）。只跑 lib：doctest 已在 Cargo.toml 关掉。
      - run: cargo test --lib --manifest-path codexbar/src-tauri/Cargo.toml

      # ⚠️ 这一步原来在 windows-latest 上跑，是 `portalock` LockFileEx 分支的唯一真实验证。
      #    Windows 取消（2026-10-19）后矩阵只剩 macOS，这里跑到的只是 fcntl 分支 —— LockFileEx 不再被验证。
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest tests.test_portalock -v

